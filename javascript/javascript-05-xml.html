<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Obtener datos XML</h1>
    <button onclick="cargar()">Cargar datos</button>
    <table id="tabla" border="1"></table>

    <script>
        function cargar() {
            const xhttp = new XMLHttpRequest();
            console.log(xhttp);
            xhttp.onload = function () {
                const xmlDoc = xhttp.responseXML;
                const cd = xmlDoc.getElementsByTagName("alumno");
                miFunction(cd);
            }
            xhttp.open("GET", "../xml/xml-00.xml")
            xhttp.send();
        }
        function miFunction(cd) {
            let table = "<tr><th>Nombre</th><th>Nacimiento</th></tr>";
            for (let i = 0; i < cd.length; i++) {
                table += "<tr><td>" +
                    cd[i].getElementsByTagName("nombre")[0].childNodes[0].nodeValue +
                    "</td><td>" +
                    cd[i].getElementsByTagName("nacimiento")[0].childNodes[0].nodeValue +
                    "</td></tr>";
            }
            document.getElementById("tabla").innerHTML = table;
        }
    </script>
</body>

</html>
